<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Compress images in your browser. Adjust quality, preview the result, and download your compressed image.">
  <meta name="theme-color" content="#2563eb">
  <title>Image Compressor | EasyTools India</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .compressor {
      width: min(92%, 760px);
      margin: 2rem auto;
      padding: 1.5rem;
      border: 1px solid #dbe3ef;
      border-radius: 16px;
      background: #fff;
      color: #172033;
      box-shadow: 0 8px 28px rgba(20, 40, 80, .08);
    }
    .compressor h1 { margin-top: 0; }
    .compressor label { display: block; margin: 1rem 0 .4rem; font-weight: 600; }
    .compressor input[type="file"],
    .compressor input[type="range"],
    .compressor select { width: 100%; }
    .compressor input[type="file"],
    .compressor select { padding: .75rem; border: 1px solid #cbd5e1; border-radius: 8px; }
    .compressor button,
    .compressor .download-link {
      display: inline-block;
      margin: 1rem .5rem 0 0;
      padding: .8rem 1.1rem;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .compressor button:disabled { opacity: .5; cursor: not-allowed; }
    .compressor .preview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .compressor .preview-card { min-width: 0; padding: 1rem; border: 1px solid #dbe3ef; border-radius: 10px; }
    .compressor .preview-card img { display: block; width: 100%; max-height: 300px; object-fit: contain; }
    .compressor .status { min-height: 1.5em; margin-top: 1rem; }
    .compressor .muted { color: #526079; overflow-wrap: anywhere; }
    .compressor .error { color: #b91c1c; }
    .compressor .success { color: #166534; }
    .compressor .privacy-note { padding: .8rem; border-radius: 8px; background: #eff6ff; }
  </style>
</head>
<body>
  <main class="compressor">
    <p><a href="../index.html">← Back to EasyTools India</a></p>
    <h1>Image Compressor</h1>
    <p>Reduce image file size directly in your browser.</p>
    <p class="privacy-note">Privacy: your selected image is processed locally in this browser and is not uploaded by this tool.</p>

    <label for="image-file">Choose an image</label>
    <input id="image-file" type="file" accept="image/jpeg,image/png,image/webp">

    <label for="quality">Compression quality: <span id="quality-value">75%</span></label>
    <input id="quality" type="range" min="10" max="95" step="5" value="75">

    <label for="output-format">Output format</label>
    <select id="output-format">
      <option value="image/jpeg">JPEG</option>
      <option value="image/webp">WebP</option>
      <option value="image/png">PNG (lossless encoding; quality setting may not apply)</option>
    </select>

    <button id="compress-button" type="button" disabled>Compress image</button>
    <button id="reset-button" type="button">Reset</button>

    <p id="status" class="status" role="status" aria-live="polite">Choose an image to begin.</p>

    <section id="results" hidden>
      <div class="preview-grid">
        <div class="preview-card">
          <h2>Original</h2>
          <img id="original-preview" alt="Original image preview">
          <p id="original-info" class="muted"></p>
        </div>
        <div class="preview-card">
          <h2>Compressed</h2>
          <img id="compressed-preview" alt="Compressed image preview">
          <p id="compressed-info" class="muted"></p>
        </div>
      </div>
      <p id="savings" class="success" aria-live="polite"></p>
      <a id="download-link" class="download-link" hidden>Download compressed image</a>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const fileInput = document.getElementById("image-file");
      const qualityInput = document.getElementById("quality");
      const qualityValue = document.getElementById("quality-value");
      const formatInput = document.getElementById("output-format");
      const compressButton = document.getElementById("compress-button");
      const resetButton = document.getElementById("reset-button");
      const status = document.getElementById("status");
      const results = document.getElementById("results");
      const originalPreview = document.getElementById("original-preview");
      const compressedPreview = document.getElementById("compressed-preview");
      const originalInfo = document.getElementById("original-info");
      const compressedInfo = document.getElementById("compressed-info");
      const savings = document.getElementById("savings");
      const downloadLink = document.getElementById("download-link");

      const maxFileSize = 20 * 1024 * 1024;
      let selectedFile = null;
      let originalUrl = null;
      let compressedUrl = null;
      let operationId = 0;

      function formatBytes(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
      }

      function setStatus(message, type = "") {
        status.textContent = message;
        status.className = `status ${type}`.trim();
      }

      function clearCompressedResult() {
        if (compressedUrl) URL.revokeObjectURL(compressedUrl);
        compressedUrl = null;
        compressedPreview.removeAttribute("src");
        compressedInfo.textContent = "";
        savings.textContent = "";
        downloadLink.removeAttribute("href");
        downloadLink.hidden = true;
      }

      function resetTool() {
        operationId++;
        selectedFile = null;
        fileInput.value = "";
        compressButton.disabled = true;
        results.hidden = true;
        clearCompressedResult();

        if (originalUrl) URL.revokeObjectURL(originalUrl);
        originalUrl = null;
        originalPreview.removeAttribute("src");
        originalInfo.textContent = "";
        setStatus("Choose an image to begin.");
      }

      function loadImage(url) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error("The image could not be decoded."));
          image.src = url;
        });
      }

      fileInput.addEventListener("change", async () => {
        operationId++;
        const id = operationId;
        clearCompressedResult();
        selectedFile = null;
        compressButton.disabled = true;
        results.hidden = true;

        if (originalUrl) URL.revokeObjectURL(originalUrl);
        originalUrl = null;

        const file = fileInput.files && fileInput.files[0];
        if (!file) {
          setStatus("Choose an image to begin.");
          return;
        }

        if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
          fileInput.value = "";
          setStatus("Please select a JPEG, PNG, or WebP image.", "error");
          return;
        }

        if (file.size > maxFileSize) {
          fileInput.value = "";
          setStatus("This image exceeds the 20 MB limit. Choose a smaller image.", "error");
          return;
        }

        if (file.size === 0) {
          setStatus("The selected file is empty.", "error");
          return;
        }

        setStatus("Loading image…");

        try {
          const url = URL.createObjectURL(file);
          const image = await loadImage(url);

          if (id !== operationId) {
            URL.revokeObjectURL(url);
            return;
          }

          selectedFile = file;
          originalUrl = url;
          originalPreview.src = url;
          originalInfo.textContent =
            `${file.name} · ${formatBytes(file.size)} · ${image.naturalWidth} × ${image.naturalHeight} px`;

          results.hidden = false;
          compressButton.disabled = false;
          setStatus("Image ready. Choose your settings and compress.", "success");
        } catch {
          setStatus("Unable to open this image. Please try another file.", "error");
        }
      });

      qualityInput.addEventListener("input", () => {
        qualityValue.textContent = `${qualityInput.value}%`;
      });

      formatInput.addEventListener("change", clearCompressedResult);

      compressButton.addEventListener("click", async () => {
        if (!selectedFile) {
          setStatus("Please choose an image first.", "error");
          return;
        }

        const id = ++operationId;
        compressButton.disabled = true;
        clearCompressedResult();
        setStatus("Compressing image…");

        try {
          const image = await loadImage(originalUrl);
          if (id !== operationId) return;

          const canvas = document.createElement("canvas");
          canvas.width = image.naturalWidth;
          canvas.height = image.naturalHeight;

          const context = canvas.getContext("2d");
          if (!context) throw new Error("Canvas is not supported by this browser.");

          context.drawImage(image, 0, 0);

          const requestedType = formatInput.value;
          const quality = Number(qualityInput.value) / 100;

          const blob = await new Promise((resolve, reject) => {
            canvas.toBlob(
              (result) => result ? resolve(result) : reject(new Error("Image encoding failed.")),
              requestedType,
              quality
            );
          });

          if (id !== operationId) return;

          if (blob.type !== requestedType) {
            throw new Error("This output format is not supported by your browser. Choose JPEG or WebP.");
          }

          compressedUrl = URL.createObjectURL(blob);
          compressedPreview.src = compressedUrl;
          compressedInfo.textContent =
            `${blob.type.replace("image/", "").toUpperCase()} · ${formatBytes(blob.size)}`;

          const difference = selectedFile.size - blob.size;
          const percentage = (difference / selectedFile.size) * 100;

          if (difference > 0) {
            savings.textContent =
              `File size reduced by ${percentage.toFixed(1)}% (${formatBytes(difference)} saved).`;
          } else if (difference === 0) {
            savings.textContent = "The output file is the same size as the original.";
          } else {
            savings.textContent =
              `The output is ${Math.abs(percentage).toFixed(1)}% larger. Try another format or quality setting.`;
          }

          const baseName = selectedFile.name.replace(/\.[^.]+$/, "") || "image";
          const extension = blob.type === "image/jpeg" ? "jpg" :
            blob.type === "image/webp" ? "webp" : "png";

          downloadLink.href = compressedUrl;
          downloadLink.download = `${baseName}-compressed.${extension}`;
          downloadLink.hidden = false;

          setStatus("Compression complete. Preview and download your image.", "success");
        } catch (error) {
          if (id === operationId) {
            setStatus(error.message || "Compression failed. Please try again.", "error");
          }
        } finally {
          if (id === operationId) compressButton.disabled = !selectedFile;
        }
      });

      resetButton.addEventListener("click", resetTool);
      window.addEventListener("pagehide", () => {
        if (originalUrl) URL.revokeObjectURL(originalUrl);
        if (compressedUrl) URL.revokeObjectURL(compressedUrl);
      });
    })();
  </script>
</body>
</html>
